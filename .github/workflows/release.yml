name: Build Installers

on:
  push:
    tags:
      - 'v*'          # Se déclenche sur : git tag v1.0 && git push --tags
  workflow_dispatch:  # Permet aussi de lancer manuellement depuis GitHub

permissions:
  contents: write

jobs:


  # Linux → .deb

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build fat-jar
        run: mvn clean package -DskipTests

      - name: Create .deb installer
        run: |
          jpackage \
            --input target/ \
            --name Parabox \
            --main-jar parabox-1.0-SNAPSHOT.jar \
            --main-class fr.paris13.parabox.ig.Launcher \
            --type deb \
            --app-version 1.0 \
            --dest target/installer \
            --icon src/main/resources/images/box.png \
            --java-options "-Xmx512m"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parabox-linux
          path: target/installer/*.deb


  # Windows → .exe

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build fat-jar
        run: mvn clean package -DskipTests

      - name: Create .exe installer
        run: |
          jpackage `
            --input target/ `
            --name Parabox `
            --main-jar parabox-1.0-SNAPSHOT.jar `
            --main-class fr.paris13.parabox.ig.Launcher `
            --type exe `
            --app-version 1.0 `
            --dest target/installer `
            --win-shortcut `
            --win-menu `
            --java-options "-Xmx512m"
            --icon src/main/resources/images/box.png `

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parabox-windows
          path: target/installer/*.exe

  
  # macOS → .dmg

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build fat-jar
        run: mvn clean package -DskipTests

      - name: Create .dmg installer
        run: |
          jpackage \
            --input target/ \
            --name Parabox \
            --main-jar parabox-1.0-SNAPSHOT.jar \
            --main-class fr.paris13.parabox.ig.Launcher \
            --type dmg \
            --app-version 1.0 \
            --dest target/installer \
            --icon src/main/resources/images/box.png \
            --java-options "-Xmx512m"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parabox-macos
          path: target/installer/*.dmg


  # Crée une Release GitHub avec les 3 fichiers

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          generate_release_notes: true
